<html>
<head>
</head>
<body>
<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Échelle : 1 pixel = 0.5 m -->

  <!-- Salle de cours (20 m x 12 m) : 40 px x 24 px -->
  <rect x="10" y="10" width="40" height="24" fill="rgba(200, 200, 200, 0.2)" stroke="black" stroke-width="1"/>
  <text x="30" y="22" font-size="8" text-anchor="middle">Salle (20m x 12m)</text>
  <text x="30" y="8" font-size="6">20 m</text> <!-- Côté haut -->
  <text x="8" y="22" font-size="6" transform="rotate(-90, 8, 22)">12 m</text> <!-- Côté gauche -->

  <!-- AP-S (Canal 1) -->
  <circle cx="30" cy="22" r="2" fill="blue"/>
  <circle cx="30" cy="22" r="24" fill="none" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="30" y="30" font-size="6" text-anchor="middle">AP-S (Canal 1)</text>

  <!-- Bibliothèque (40 m x 20 m) : 80 px x 40 px -->
  <rect x="55" y="10" width="80" height="40" fill="rgba(200, 200, 200, 0.2)" stroke="black" stroke-width="1"/>
  <text x="95" y="30" font-size="8" text-anchor="middle">Bibliothèque (40m x 20m)</text>
  <text x="95" y="8" font-size="6">40 m</text> <!-- Côté haut -->
  <text x="53" y="30" font-size="6" transform="rotate(-90, 53, 30)">20 m</text> <!-- Côté gauche -->

  <!-- AP-B1 (Canal 1), AP-B2 (Canal 6), AP-B3 (Canal 11) -->
  <circle cx="115" cy="30" r="2" fill="blue"/> <!-- AP-B1 -->
  <circle cx="115" cy="30" r="24" fill="none" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="115" y="38" font-size="6" text-anchor="middle">AP-B1 (Canal 1)</text>

  <circle cx="75" cy="30" r="2" fill="green"/> <!-- AP-B2 -->
  <circle cx="75" cy="30" r="24" fill="none" stroke="green" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="75" y="38" font-size="6" text-anchor="middle">AP-B2 (Canal 6)</text>

  <circle cx="95" cy="20" r="2" fill="red"/> <!-- AP-B3 -->
  <circle cx="95" cy="20" r="24" fill="none" stroke="red" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="95" y="28" font-size="6" text-anchor="middle">AP-B3 (Canal 11)</text>

  <!-- Amphithéâtre (25 m x 12 m) : 50 px x 24 px -->
  <rect x="140" y="10" width="50" height="24" fill="rgba(200, 200, 200, 0.2)" stroke="black" stroke-width="1"/>
  <text x="165" y="22" font-size="8" text-anchor="middle">Amphithéâtre (25m x 12m)</text>
  <text x="165" y="8" font-size="6">25 m</text> <!-- Côté haut -->
  <text x="138" y="22" font-size="6" transform="rotate(-90, 138, 22)">12 m</text> <!-- Côté gauche -->

  <!-- AP-A1 (Canal 6), AP-A2 (Canal 11) -->
  <circle cx="150" cy="22" r="2" fill="green"/> <!-- AP-A1 -->
  <circle cx="150" cy="22" r="24" fill="none" stroke="green" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="150" y="30" font-size="6" text-anchor="middle">AP-A1 (Canal 6)</text>

  <circle cx="180" cy="22" r="2" fill="red"/> <!-- AP-A2 -->
  <circle cx="180" cy="22" r="24" fill="none" stroke="red" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="180" y="30" font-size="6" text-anchor="middle">AP-A2 (Canal 11)</text>

  <!-- Couloir (30 m x 5 m) : 60 px x 10 px -->
  <rect x="55" y="55" width="60" height="10" fill="rgba(200, 200, 200, 0.2)" stroke="black" stroke-width="1"/>
  <text x="85" y="60" font-size="8" text-anchor="middle">Couloir (30m x 5m)</text>
  <text x="85" y="53" font-size="6">30 m</text> <!-- Côté haut -->
  <text x="53" y="60" font-size="6" transform="rotate(-90, 53, 60)">5 m</text> <!-- Côté gauche -->

  <!-- Annotation pour couverture du couloir -->
  <text x="85" y="70" font-size="6" text-anchor="middle">Couvert par AP-B2 (Canal 6)</text>

  <!-- Titre et légende -->
  <text x="150" y="5" font-size="12" text-anchor="middle">Plan RF - 6 AP</text>
  <text x="150" y="15" font-size="8">Canaux : 1 (bleu), 6 (vert), 11 (rouge)</text>
</svg>
</body>
</html>
